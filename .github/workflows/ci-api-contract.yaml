name: Deploy OpenAPI Contract

on:
  push:
    branches: [main]
    paths:
      - 'notification-service-openapi-contract/pom.xml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Deploy contract module
        run: ./mvnw deploy -pl notification-service-openapi-contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}